name: Release
# Push a tag such as v0.3.0 to build the slim portable ZIP and publish a GitHub release.
# Release notes are taken from docs/releases/<tag>.md when that file exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build
        required: true
permissions:
  contents: write
jobs:
  portable-zip:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check deterministic schedule boundaries
        shell: powershell
        run: .\tests\Schedule.Tests.ps1
      - name: Build and audit the portable ZIP
        run: |
          python -m pip install --disable-pip-version-check pillow imagequant
          python tools/build_release.py ${{ env.TAG }}
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/Wanwan-${TAG}-windows.zip" --clobber
          else
            gh release create "$TAG" "dist/Wanwan-${TAG}-windows.zip" --title "Wanwan ${TAG}" --latest "${args[@]}"
          fi
